<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="560" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="390" y="32" font-family="Georgia, serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">OTM Product Architecture — Three-Tier Overview</text>

  <!-- CLIENT box -->
  <rect x="30" y="155" width="130" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="95" y="188" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">CLIENT</text>
  <text x="95" y="206" font-family="Georgia, serif" font-size="10" fill="#64748b" text-anchor="middle">End User Browser</text>
  <text x="95" y="222" font-family="Georgia, serif" font-size="10" fill="#64748b" text-anchor="middle">(Desktop / Laptop)</text>
  <text x="95" y="242" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">HTTP / HTTPS</text>

  <!-- Arrow: Client to Web -->
  <line x1="162" y1="205" x2="205" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="205" y1="218" x2="162" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WEB TIER -->
  <rect x="208" y="55" width="150" height="310" rx="8" fill="#fff7f6" stroke="#c74634" stroke-width="2"/>
  <text x="283" y="82" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#c74634" text-anchor="middle">WEB TIER</text>
  <text x="283" y="100" font-family="Georgia, serif" font-size="10" fill="#64748b" text-anchor="middle">Presentation Layer</text>
  <rect x="224" y="112" width="118" height="68" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="283" y="132" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Oracle HTTP Server</text>
  <text x="283" y="148" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Receives browser requests</text>
  <text x="283" y="162" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Serves static content</text>
  <text x="283" y="174" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">directly to user</text>
  <rect x="224" y="192" width="118" height="58" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="283" y="211" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">mod_wl_ohs</text>
  <text x="283" y="228" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Connector — proxies</text>
  <text x="283" y="242" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">dynamic requests to App Tier</text>
  <rect x="224" y="262" width="118" height="50" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="283" y="281" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Static Content</text>
  <text x="283" y="297" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Help Pages · Labels · JS</text>

  <!-- Arrow: Web to App -->
  <line x1="360" y1="205" x2="403" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="403" y1="218" x2="360" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- APP TIER -->
  <rect x="406" y="55" width="150" height="310" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="481" y="82" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">APP TIER</text>
  <text x="481" y="100" font-family="Georgia, serif" font-size="10" fill="#64748b" text-anchor="middle">Business Logic Layer</text>
  <rect x="422" y="112" width="118" height="55" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="481" y="132" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Oracle WebLogic</text>
  <text x="481" y="148" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Application Server</text>
  <text x="481" y="161" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">(JNDI / RMI / JDBC)</text>
  <rect x="422" y="179" width="118" height="58" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="481" y="198" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">UI Component</text>
  <text x="481" y="214" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Servlet container —</text>
  <text x="481" y="228" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">renders dynamic HTML</text>
  <rect x="422" y="249" width="118" height="63" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="481" y="267" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Business Component</text>
  <text x="481" y="283" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Bulk Plan · Agents</text>
  <text x="481" y="297" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Rating · Tender · Invoice</text>

  <!-- Arrow: App to DB -->
  <line x1="558" y1="205" x2="601" y2="205" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="601" y1="218" x2="558" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DATABASE TIER -->
  <rect x="604" y="55" width="150" height="310" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="679" y="82" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">DATABASE TIER</text>
  <text x="679" y="100" font-family="Georgia, serif" font-size="10" fill="#64748b" text-anchor="middle">Data Layer</text>
  <rect x="620" y="112" width="118" height="55" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="679" y="132" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Oracle Database</text>
  <text x="679" y="148" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Stores all OTM data</text>
  <text x="679" y="161" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">accessed via JDBC</text>
  <rect x="620" y="179" width="118" height="58" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="679" y="198" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">GLOGOWNER Schema</text>
  <text x="679" y="214" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Main OTM schema —</text>
  <text x="679" y="228" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">orders, shipments, config</text>
  <rect x="620" y="249" width="118" height="63" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="679" y="267" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">REPORTOWNER Schema</text>
  <text x="679" y="283" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Reporting data —</text>
  <text x="679" y="297" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">rates, locations, carriers</text>

  <!-- Arrow down to External Systems -->
  <line x1="481" y1="367" x2="481" y2="400" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-yellow)"/>

  <!-- External Systems label -->
  <text x="390" y="422" font-family="Georgia, serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">External Systems (communicate with App Tier)</text>

  <!-- External boxes -->
  <rect x="30" y="432" width="160" height="60" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="110" y="455" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Mileage Engines</text>
  <text x="110" y="471" font-family="Georgia, serif" font-size="9" fill="#b45309" text-anchor="middle">PC*MILER · MileMaker</text>

  <rect x="205" y="432" width="160" height="60" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="285" y="455" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">LTL Rate Engines</text>
  <text x="285" y="471" font-family="Georgia, serif" font-size="9" fill="#b45309" text-anchor="middle">SMC³ RateWare XL</text>

  <rect x="380" y="432" width="185" height="60" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="472" y="455" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">ERP / Integration</text>
  <text x="472" y="471" font-family="Georgia, serif" font-size="9" fill="#b45309" text-anchor="middle">Oracle EBS · SAP · MuleSoft</text>

  <rect x="580" y="432" width="170" height="60" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="665" y="455" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Mail Server</text>
  <text x="665" y="471" font-family="Georgia, serif" font-size="9" fill="#b45309" text-anchor="middle">SMTP (Notifications)</text>

  <!-- Legend -->
  <text x="390" y="528" font-family="Georgia, serif" font-size="9" fill="#94a3b8" text-anchor="middle">Solid arrows = two-way communication between tiers   |   Dashed arrow = App Tier connects to external systems</text>
</svg>
