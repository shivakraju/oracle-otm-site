<style>
.tier-web   { border-left: 4px solid #c74634; background: #fff7f6; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.tier-app   { border-left: 4px solid #0ea5e9; background: #f0f9ff; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.tier-db    { border-left: 4px solid #16a34a; background: #f0fdf4; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.tier-env   { border-left: 4px solid #6366f1; background: #f5f3ff; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.tier-web strong:first-child { color: #c74634; }
.tier-app strong:first-child { color: #0369a1; }
.tier-db  strong:first-child { color: #15803d; }
.note-box   { border-left: 4px solid #c74634; background: #fff7f6; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.field-box  { border-left: 4px solid #94a3b8; background: #f8fafc; padding: 12px 16px; margin: 8px 0; border-radius: 0 6px 6px 0; }
.field-box strong:first-child, .field-box > strong { font-family: "Consolas","Courier New",monospace; font-size: 0.9em; cursor: text; }
.book-post-content, .markdown-inner { user-select: none; -webkit-user-select: none; }
pre, pre *, code, code *, .chroma, .chroma *, .field-box strong:first-child, .field-box > strong, kbd, samp { user-select: text !important; -webkit-user-select: text !important; cursor: text; }
pre { position: relative; }
.copy-btn { position:absolute; top:8px; right:8px; padding:3px 10px; font-size:12px; background:#0369a1; color:#fff; border:none; border-radius:4px; cursor:pointer !important; opacity:0.75; user-select:none !important; }
.copy-btn:hover { opacity:1; }
.copy-btn.copied { background:#16a34a; }
.step-box   { border-left: 4px solid #0369a1; background: #f0f9ff; padding: 12px 16px; margin: 16px 0 8px; border-radius: 0 6px 6px 0; }
</style>

<style>
.post-content img { width: 100%; height: auto; display: block; border: 1px solid #e2e8f0; border-radius: 4px; margin: 12px 0; cursor: zoom-in; }
#img-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
#img-lightbox.open { display:flex; }
#img-lightbox img { max-width:95vw; max-height:95vh; object-fit:contain; border-radius:4px; box-shadow:0 8px 40px rgba(0,0,0,0.6); }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var lb = document.createElement('div');
  lb.id = 'img-lightbox';
  var lbImg = document.createElement('img');
  lb.appendChild(lbImg);
  document.body.appendChild(lb);

  document.querySelectorAll('pre').forEach(function(pre) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    pre.appendChild(btn);
    btn.addEventListener('click', function() {
      var code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    });
  });

  document.querySelectorAll('.post-content img').forEach(function(img) {
    img.addEventListener('click', function() {
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lb.classList.add('open');
    });
  });
  lb.addEventListener('click', function() { lb.classList.remove('open'); lbImg.src = ''; });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { lb.classList.remove('open'); lbImg.src = ''; } });
});
</script>
